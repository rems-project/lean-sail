name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [leanprover/lean4:v4.29.0, leanprover/lean4:v4.35.0]
    env:
      ELAN_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Lake fetches this checkout as an independent Git dependency.
          fetch-depth: 0
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$ELAN_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build runtime and tests strictly
        run: lake --no-cache build --wfail --iofail
      - name: Build an independent consumer from clean Git sources
        run: python3 scripts/check_consumer.py --toolchain "$ELAN_TOOLCHAIN"
